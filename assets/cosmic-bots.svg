<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Cosmic Bots</title>
  <desc id="description">Astronomy events, space discoveries and daily stories delivered to Discord and Cosmic Atlas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D0F12"/>
      <stop offset=".58" stop-color="#121418"/>
      <stop offset="1" stop-color="#19161F"/>
    </linearGradient>
    <linearGradient id="orbit" x1="630" y1="62" x2="1128" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B493FF" stop-opacity=".05"/>
      <stop offset=".48" stop-color="#B493FF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#CBB2FF" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="planet" x1="810" y1="150" x2="1002" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBB2FF"/>
      <stop offset=".45" stop-color="#8B6BCB"/>
      <stop offset="1" stop-color="#35274C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(150 115 -120 157 904 217)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B493FF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#B493FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#CBB2FF" stroke-opacity=".045"/>
    </pattern>
    <filter id="softGlow" x="735" y="95" width="345" height="270" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="23"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <path fill="url(#background)" d="M0 0h1200v420H0z"/>
    <path fill="url(#grid)" d="M0 0h1200v420H0z"/>
    <path fill="url(#glow)" d="M0 0h1200v420H0z"/>

    <path d="M0 339c171-42 288-45 423-11 135 33 218 31 353-20 137-52 257-68 424-35" stroke="#B493FF" stroke-opacity=".11"/>
    <path d="M0 354c182-40 284-34 416-3 149 35 238 29 363-19 147-56 261-67 421-44" stroke="#B493FF" stroke-opacity=".07"/>

    <g fill="#E5DAFF">
      <circle cx="623" cy="75" r="1.5" opacity=".8"/>
      <circle cx="746" cy="103" r="1" opacity=".62"/>
      <circle cx="1105" cy="98" r="1.6" opacity=".66"/>
      <circle cx="1156" cy="264" r="1.3" opacity=".75"/>
      <circle cx="1063" cy="346" r="1" opacity=".58"/>
      <circle cx="704" cy="330" r="1.4" opacity=".7"/>
      <circle cx="683" cy="168" r="1" opacity=".6"/>
      <circle cx="1109" cy="184" r="1" opacity=".7"/>
    </g>
    <g stroke="#CBB2FF" stroke-opacity=".55" stroke-width="1">
      <path d="M752 179v8m-4-4h8"/>
      <path d="M1080 128v8m-4-4h8"/>
      <path d="M1128 310v8m-4-4h8"/>
    </g>

    <text x="78" y="111" fill="#CBB2FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.8">AUTOMATED SPACE DISCOVERY</text>
    <text x="74" y="187" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="650" letter-spacing="-2.6">Cosmic Bots</text>
    <path d="M80 211h46" stroke="#B493FF" stroke-width="2"/>
    <text x="80" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Space discoveries, delivered to Discord.</text>
    <text x="80" y="291" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Sky events · Deep space · Daily quiz · Space history</text>
    <text x="80" y="358" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.1">FOUR SPECIALIST BOTS  /  ONE COORDINATED SYSTEM</text>

    <ellipse cx="911" cy="218" rx="259" ry="92" transform="rotate(-24 911 218)" stroke="url(#orbit)" stroke-width="1.5"/>
    <ellipse cx="911" cy="218" rx="220" ry="65" transform="rotate(32 911 218)" stroke="#CBB2FF" stroke-opacity=".19"/>
    <ellipse cx="911" cy="218" rx="184" ry="127" transform="rotate(-60 911 218)" stroke="#CBB2FF" stroke-opacity=".13"/>
    <circle cx="907" cy="218" r="101" fill="#B493FF" fill-opacity=".14" filter="url(#softGlow)"/>
    <circle cx="907" cy="218" r="68" fill="url(#planet)"/>
    <path d="M841 208c34-20 80-28 132-21M844 229c35-13 77-17 123-10M858 256c29-7 58-8 92-4" stroke="#F0E9FF" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M870 161c-15 17-22 37-22 59 0 27 10 49 29 66-25-10-42-34-42-62 0-29 15-52 35-63Z" fill="#F0E9FF" fill-opacity=".22"/>

    <circle cx="727" cy="141" r="5" fill="#B493FF"/>
    <circle cx="727" cy="141" r="10" stroke="#B493FF" stroke-opacity=".3"/>
    <circle cx="1087" cy="277" r="4.5" fill="#CBB2FF"/>
    <circle cx="1087" cy="277" r="9" stroke="#CBB2FF" stroke-opacity=".28"/>
    <circle cx="1018" cy="111" r="4" fill="#E5DAFF"/>
    <circle cx="804" cy="333" r="3.5" fill="#B493FF"/>
    <circle cx="804" cy="333" r="8" stroke="#B493FF" stroke-opacity=".25"/>

    <g fill="#CBB2FF" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing=".8">
      <text x="1053" y="296">DEEP SPACE</text>
      <text x="683" y="126">LIVE EVENTS</text>
      <text x="1027" y="99">QUIZ</text>
      <text x="765" y="359">SPACE HISTORY</text>
    </g>
  </g>
</svg>
