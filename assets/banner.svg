<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Cosmic Nexus - Bots</title>
  <desc id="bannerDesc">Autonomous astronomy and discovery engine for Cosmic Atlas.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.48" stop-color="#0c0f15"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>

    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B493FF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#B493FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#B493FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="band" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B493FF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#B493FF" stop-opacity="0.12"/>
      <stop offset="0.62" stop-color="#38BDF8" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F1ECFF"/>
      <stop offset="1" stop-color="#B493FF"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B493FF" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#B493FF" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF7E8"/>
      <stop offset="0.45" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FBBF24" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planetGold" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#B45309"/>
    </radialGradient>

    <radialGradient id="planetCyan" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#D7F5FF"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0E7490"/>
    </radialGradient>

    <radialGradient id="planetEmerald" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#D8FFF1"/>
      <stop offset="0.55" stop-color="#34D399"/>
      <stop offset="1" stop-color="#047857"/>
    </radialGradient>

    <radialGradient id="planetViolet" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#F2EAFF"/>
      <stop offset="0.55" stop-color="#B493FF"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </radialGradient>

    <filter id="softGlow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .orbit { animation: drift 32s linear infinite; }
      @keyframes drift { to { stroke-dashoffset: -120; } }
      .twinkle { animation: tw 6s ease-in-out infinite alternate; }
      @keyframes tw { from { opacity: 0.14; } to { opacity: 0.82; } }
      .core { animation: pulse 7s ease-in-out infinite; transform-origin: 1010px 172px; }
      @keyframes pulse { 0%, 100% { opacity: 0.92; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .twinkle, .core { animation: none; }
      }
    </style>
  </defs>

