name: Daily Space History Cron

on:
  schedule:
    # Runs daily at 15:00 UTC (18:00 EEST)
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run-history-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r space-history-bot/requirements.txt

      - name: Cache SQLite database
        uses: actions/cache@v4
        with:
          path: space-history-bot/history.db
          key: history-db-${{ github.run_id }}
          restore-keys: |
            history-db-

      - name: Run Space History Engine
        env:
          SPACE_HISTORY_BOT_DISCORD_WEBHOOK_URL: ${{ secrets.SPACE_HISTORY_BOT_DISCORD_WEBHOOK_URL }}
          SPACE_HISTORY_BOT_DISCORD_ROLE_ID: ${{ secrets.SPACE_HISTORY_BOT_DISCORD_ROLE_ID }}
          TEST_MODE: "FALSE"
        run: |
          cd space-history-bot
          python bot.py
