name: Daily Space Quiz Cron

on:
  schedule:
    # Runs daily at 13:00 UTC (16:00 EEST)
    - cron: '0 13 * * *'
  workflow_dispatch:

# Prevents double-execution with the main orchestrator
concurrency:
  group: space-quiz-standalone-execution
  cancel-in-progress: true

jobs:
  run-quiz-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r space-quiz-bot/requirements.txt

      - name: Cache SQLite database
        uses: actions/cache@v4
        with:
          path: space-quiz-bot/quiz.db
          key: quiz-db-${{ github.run_id }}
          restore-keys: |
            quiz-db-

      - name: Run Space Quiz Core Engine
        env:
          SPACE_QUIZ_BOT_DISCORD_WEBHOOK_URL: ${{ secrets.SPACE_QUIZ_BOT_DISCORD_WEBHOOK_URL }}
          SPACE_QUIZ_BOT_DISCORD_ROLE_ID: ${{ secrets.SPACE_QUIZ_BOT_DISCORD_ROLE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODE: "FALSE"
        run: |
          cd space-quiz-bot
          python bot.py
