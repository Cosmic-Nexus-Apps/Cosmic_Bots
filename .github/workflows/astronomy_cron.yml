name: Astronomy Events Cron

on:
  schedule:
    # Runs every 3 hours automatically
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r events-bot/requirements.txt

    - name: Run Cosmic Events Engine
      env:
        EVENTS_BOT_DISCORD_WEBHOOK_URL: ${{ secrets.EVENTS_BOT_DISCORD_WEBHOOK_URL }}
        EVENTS_BOT_DISCORD_ROLE_ID: ${{ secrets.EVENTS_BOT_DISCORD_ROLE_ID }}
        TEST_MODE: "FALSE"
      run: |
        cd events-bot
        python bot.py