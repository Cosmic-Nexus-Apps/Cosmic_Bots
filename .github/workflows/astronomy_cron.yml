name: Astronomy Events Cron

on:
  schedule:
    # Runs every 5 minutes automatically (FREE tier high-frequency polling)
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Prevents execution overlap: If a job runs >5 minutes, cancel the previous stuck job
concurrency:
  group: cosmic-nexus-cron-execution
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f astro-events-bot/requirements.txt ]; then pip install -r astro-events-bot/requirements.txt; fi
        if [ -f deep-space-bot/requirements.txt ]; then pip install -r deep-space-bot/requirements.txt; fi
        if [ -f space-quiz-bot/requirements.txt ]; then pip install -r space-quiz-bot/requirements.txt; fi
        if [ -f space-history-bot/requirements.txt ]; then pip install -r space-history-bot/requirements.txt; fi

    - name: Restore & Cache SQLite Databases
      uses: actions/cache@v4
      with:
        path: |
          events-bot/events.db
          deep-space-bot/deep_space.db
          space-quiz-bot/quiz.db
          space-history-bot/history.db
          events.db
          scheduler.db
        key: cosmic-nexus-db-${{ github.run_id }}
        restore-keys: |
          cosmic-nexus-db-
          events-db-

    - name: Run Cosmic Nexus High-Frequency Orchestrator
      env:
        EVENTS_BOT_DISCORD_WEBHOOK_URL: ${{ secrets.EVENTS_BOT_DISCORD_WEBHOOK_URL }}
        EVENTS_BOT_DISCORD_ROLE_ID: ${{ secrets.EVENTS_BOT_DISCORD_ROLE_ID }}
        DEEP_SPACE_BOT_DISCORD_WEBHOOK_URL: ${{ secrets.DEEP_SPACE_BOT_DISCORD_WEBHOOK_URL }}
        DEEP_SPACE_BOT_DISCORD_ROLE_ID: ${{ secrets.DEEP_SPACE_BOT_DISCORD_ROLE_ID }}
        SPACE_QUIZ_BOT_DISCORD_WEBHOOK_URL: ${{ secrets.SPACE_QUIZ_BOT_DISCORD_WEBHOOK_URL }}
        SPACE_QUIZ_BOT_DISCORD_ROLE_ID: ${{ secrets.SPACE_QUIZ_BOT_DISCORD_ROLE_ID }}
        SPACE_HISTORY_BOT_DISCORD_WEBHOOK_URL: ${{ secrets.SPACE_HISTORY_BOT_DISCORD_WEBHOOK_URL }}
        SPACE_HISTORY_BOT_DISCORD_ROLE_ID: ${{ secrets.SPACE_HISTORY_BOT_DISCORD_ROLE_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        TEST_MODE: "FALSE"
      run: |
        python main_orchestrator.py