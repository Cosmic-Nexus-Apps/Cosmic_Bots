name: Cosmic Alerts

# Checks discovery sources and sends push notifications (FCM data-only).
# Runs every 10 minutes; GitHub may be delayed by a few minutes during busy periods.
#
# Location: copy this file into the Cosmic_Bots repository at
#   .github/workflows/cosmic-alerts.yml
# and the bot code is in the:
#   cosmic-alerts/

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosmic-alerts
  cancel-in-progress: false

defaults:
  run:
    working-directory: cosmic-alerts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cosmic-alerts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check sources and send alerts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TNS_BOT_ID: ${{ secrets.TNS_BOT_ID }}
          TNS_BOT_NAME: ${{ secrets.TNS_BOT_NAME }}
          TNS_API_KEY: ${{ secrets.TNS_API_KEY }}
          # Alternative without a bot/API key: user marker (TNS_USER_ID + TNS_USER_NAME).
          TNS_USER_ID: ${{ secrets.TNS_USER_ID }}
          TNS_USER_NAME: ${{ secrets.TNS_USER_NAME }}
        run: node src/index.mjs

      - name: Persist seen state
        working-directory: .
        run: |
          git config user.name "cosmic-alerts-bot"
          git config user.email "cosmic-alerts-bot@users.noreply.github.com"
          git add cosmic-alerts/.state/seen.json cosmic-alerts/alerts/feed.json
          if git diff --staged --quiet; then
            echo "Nicio modificare de publicat."
            exit 0
          fi
          git commit -m "chore(alerts): update state and live feed"
          # Other bots in the repository push frequently: retry with rebase,
          # otherwise a rejected push (fetch first) would stop the entire job.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Push eșuat după 3 încercări." >&2
          exit 1
