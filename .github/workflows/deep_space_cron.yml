name: Deep Space & Rocket Launch Cron

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Prevents double-execution with the main orchestrator on the same run window
concurrency:
  group: deep-space-standalone-execution
  cancel-in-progress: true

jobs:
  run-deep-space-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deep-space-bot/requirements.txt

      - name: Cache SQLite database
        uses: actions/cache@v4
        with:
          path: deep-space-bot/deep_space.db
          key: deep-space-db-${{ github.run_id }}
          restore-keys: |
            deep-space-db-

      - name: Run Deep Space & Launch Engine
        env:
          DEEP_SPACE_BOT_DISCORD_WEBHOOK_URL: ${{ secrets.DEEP_SPACE_BOT_DISCORD_WEBHOOK_URL }}
          DEEP_SPACE_BOT_DISCORD_ROLE_ID: ${{ secrets.DEEP_SPACE_BOT_DISCORD_ROLE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          TEST_MODE: "FALSE"
        run: |
          cd deep-space-bot
          python bot.py
